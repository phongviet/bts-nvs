# exp008 -- transient-mask-out-of-loss A/B (plan_execution_v3 W3 D3, local).
# Prereq per scene: masks built by src/data_prep/build_transient_masks.py and
# symlinked as <staging>/masks -> transient_masks/ (mask files: <stem>.png,
# 255=keep, 0=ignore).
# IMPORTANT (verified Jul 9): nerfstudio does NOT auto-pick-up <staging>/masks.
# ColmapDataParser.masks_path defaults to None; masks are used only when
# --masks-path is passed as a DATAPARSER arg (after `colmap`), exactly like the
# Week-2 sky_mask variant (run_backend_ablation_hcm0034.sh line 148). Hence
# dataparser_args below. Consequence: control runs are unaffected by the masks
# symlink -- no ordering constraint between control and masked.
# Control = exp007's control cell (same CSV, same base config, dense +
# antialiased 30k). Expect the win concentrated on HCM0181 (street traffic).
experiment: exp008_transient_mask
results_csv: results/week3_tierA_ablation.csv
gpu: local
split: public_set
scenes: [hcm0034, HCM0181]
data_template: "data/processed/phase1/{scene}/train_staging_dense"
eval: public_gt
base_args:
  - "--pipeline.model.rasterize-mode"
  - "antialiased"
variants:
  masked:
    method: splatfacto
    iters: 30000
    dataparser_args: ["--masks-path", "masks"]

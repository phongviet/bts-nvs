# exp008 -- transient-mask-out-of-loss A/B (plan_execution_v3 W3 D3, local).
# Prereq per scene (symlinks masks/ into the dense staging dir):
#   python src/data_prep/build_transient_masks.py \
#       --images data/raw/phase1/public_set/{scene}/train/images \
#       --processed-root data/processed/phase1 --scene {scene} \
#       --staging-dir-name train_staging_dense --qa
# nerfstudio picks up <staging>/masks automatically (same mechanism as the
# Week-2 sky masks). Expect the win concentrated on HCM0181 (street traffic).
# NOTE: control and masked share data_template -- run control BEFORE building
# masks into the staging dir, or point control at a mask-free staging copy.
experiment: exp008_transient_mask
results_csv: results/week3_tierA_ablation.csv
gpu: local
split: public_set
scenes: [hcm0034, HCM0181]
data_template: "data/processed/phase1/{scene}/train_staging_dense"
eval: public_gt
base_args:
  - "--pipeline.model.rasterize-mode"
  - "antialiased"
variants:
  masked: {method: splatfacto, iters: 30000}
